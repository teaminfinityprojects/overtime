# nginx para el export HTML5 de Godot (Overtime).
# - Tipos MIME correctos para .wasm y .pck.
# - gzip al vuelo para html/js/wasm; el .pck ya va comprimido dentro (Godot) y se sirve tal cual.
# - Sin caché ciega: los ficheros del export se llaman igual en cada versión (index.pck, index.js…), así que
#   todo va con "no-cache": el navegador y Cloudflare revalidan en cada visita y, si no ha cambiado, reciben
#   un 304 sin volver a descargar. Con max-age, tras un despliegue se seguía sirviendo el juego viejo.
# - Cabeceras COOP/COEP: no hacen falta sin hilos, pero no molestan y permiten activarlos después.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js;
        application/json          json;
        font/ttf                  ttf;
        application/wasm          wasm;
        application/octet-stream  pck;
        image/png                 png;
        image/svg+xml             svg;
        image/x-icon              ico;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location ~* \.(wasm|pck|js|json|png|ttf)$ {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
