# nginx para el export HTML5 de Godot (Overtime).
# - Tipos MIME correctos para .wasm y .pck.
# - gzip al vuelo para html/js/wasm; el .pck ya va comprimido dentro (Godot) y se sirve tal cual.
# - Caché larga para los binarios (cambian de nombre con cada export solo si se versiona; por eso
#   index.html va sin caché y los binarios con revalidación corta).
# - Cabeceras COOP/COEP: no hacen falta sin hilos, pero no molestan y permiten activarlos después.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js;
        application/wasm          wasm;
        application/octet-stream  pck;
        image/png                 png;
        image/svg+xml             svg;
        image/x-icon              ico;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location ~* \.(wasm|pck|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
