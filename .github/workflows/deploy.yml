# Construye la imagen web (export HTML5 + nginx) en cada push a main y la publica en GHCR.
# Después avisa a Dokploy por webhook para que redepliegue (secreto DOKPLOY_WEBHOOK_URL, opcional).
#
# Por qué aquí y no en Dokploy: los medios van por Git LFS y este checkout los trae de verdad
# (lfs: true). Si Dokploy construye desde el repo sin LFS, el export saldría vacío.

name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy en Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        if: ${{ env.WEBHOOK != '' }}
        run: curl -fsS -X POST "$WEBHOOK"
